name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    env:
      # ViewInspector 0.10.5 references SDK 26 types; retain macOS 15 runtime testing.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Show runner and Swift toolchain
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          swift --version
      - name: Test
        run: swift test --enable-code-coverage
      - name: Report Swift coverage
        run: python3 scripts/check-coverage.py "$(swift test --show-codecov-path)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test agent tools and CLI
        run: |
          python3 -m venv /tmp/barkeep-test-env
          /tmp/barkeep-test-env/bin/pip install coverage==7.17.2
          /tmp/barkeep-test-env/bin/python -m coverage run --source=mcp,hooks -m unittest discover -s Tests/Python
          /tmp/barkeep-test-env/bin/python -m coverage report --fail-under=100
      - uses: actions/upload-artifact@v4
        with:
          name: swift-coverage
          path: .build/**/codecov/*.json
      - name: Package and verify a local validation archive
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' packaging/Info.plist)
          ./scripts/package-release.sh "${version}-local-validation"
