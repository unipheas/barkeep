name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show runner and Swift toolchain
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          swift --version
      - name: Test
        run: swift test --enable-code-coverage
      - name: Report Swift coverage
        run: python3 scripts/check-coverage.py "$(swift test --show-codecov-path)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test agent tools and CLI
        run: |
          python3 -m venv /tmp/barkeep-test-env
          /tmp/barkeep-test-env/bin/pip install coverage==7.17.2
          /tmp/barkeep-test-env/bin/python -m coverage run --source=mcp -m unittest discover -s Tests/Python
          /tmp/barkeep-test-env/bin/python -m coverage report --fail-under=100
      - uses: actions/upload-artifact@v4
        with:
          name: swift-coverage
          path: .build/**/codecov/*.json
      - name: Build
        run: swift build -c release
      - name: Package app bundle
        run: |
          # make-app.sh signs and launches; in CI just verify the bundle assembles.
          swift build -c release
          mkdir -p dist/BarKeep.app/Contents/MacOS
          cp .build/release/BarKeep dist/BarKeep.app/Contents/MacOS/
