name: verify release tag

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show runner and Swift toolchain
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          swift --version
      - name: Test
        run: swift test --enable-code-coverage
      - name: Enforce complete Swift coverage for production release
        run: python3 scripts/check-coverage.py "$(swift test --show-codecov-path)" --minimum 100
      - name: Test agent tools
        run: python3 -m unittest discover -s Tests/Python
