name: verify release tag

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    env:
      # ViewInspector 0.10.5 references SDK 26 types; retain macOS 15 runtime testing.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Show runner and Swift toolchain
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          swift --version
      - name: Install acceptance project generator
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Enforce complete Swift coverage and app acceptance
        run: python3 scripts/test-full-coverage.py --with-login-item-test
      - name: Preserve Swift coverage and acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-coverage-and-acceptance
          path: coverage-artifacts/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce complete agent tool coverage
        run: |
          python3 -m venv /tmp/barkeep-release-tests
          /tmp/barkeep-release-tests/bin/pip install coverage==7.17.2
          /tmp/barkeep-release-tests/bin/python -m coverage run --source=mcp,hooks -m unittest discover -s Tests/Python
          /tmp/barkeep-release-tests/bin/python -m coverage report --fail-under=100
