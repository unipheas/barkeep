name: verify release tag

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show runner and Swift toolchain
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          swift --version
      - name: Test
        run: swift test --enable-code-coverage
      - name: Enforce complete Swift coverage for production release
        run: python3 scripts/check-coverage.py "$(swift test --show-codecov-path)" --minimum 100
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce complete agent tool coverage
        run: |
          python3 -m venv /tmp/barkeep-release-tests
          /tmp/barkeep-release-tests/bin/pip install coverage==7.17.2
          /tmp/barkeep-release-tests/bin/python -m coverage run --source=mcp,hooks -m unittest discover -s Tests/Python
          /tmp/barkeep-release-tests/bin/python -m coverage report --fail-under=100
